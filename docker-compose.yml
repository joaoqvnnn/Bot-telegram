version: '3.8'

services:
  # ==========================================
  # FOFOCA BOT
  # ==========================================
  bot:
    build: .
    container_name: fofoca-bot
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs
    networks:
      - fofoca-network

  # ==========================================
  # POSTGRES
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: fofoca-postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASS:-postgres}
      - POSTGRES_DB=${DB_NAME:-fofoca_bot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - fofoca-network

  # ==========================================
  # REDIS
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: fofoca-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fofoca-network

  # ==========================================
  # ADMIN (NGINX)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: fofoca-admin
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./admin:/usr/share/nginx/html/admin
      - ./admin-assets:/usr/share/nginx/html/admin-assets
      - ./public:/usr/share/nginx/html/public
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - bot
    networks:
      - fofoca-network

volumes:
  postgres_data:
    name: fofoca-postgres-data
  redis_data:
    name: fofoca-redis-data

networks:
  fofoca-network:
    name: fofoca-network
    driver: bridge
